# 10 komoditas PIHPS. Kunci = id internal (snake_case), dipakai di semua artefak.
# pihps_name      : nama baris level-1 di file PIHPS
# variant         : varian level-2 representatif (aturan U10, PROVISIONAL sampai G6; lihat DECISIONS D-011)
# role            : focus | control | other   (proposal §4.3)
# focus_group     : grup konfirmatori H5 (daging_ayam & telur_ayam = satu grup "pakan")
# exposure_path   : direct_import | imported_input | export_parity | domestic
# pinksheet       : {kolom Pink Sheet: bobot}; kosong = tidak ada w_it (hanya penggerak kurs)
# hs_codes        : prefiks HS untuk concordance & rasio impor
# faostat_items   : item FAOSTAT SUA untuk rasio impor langsung (kosong = tidak tersedia, U5)
# unit            : satuan harga eceran

beras:
  pihps_name: Beras
  variant: Beras Kualitas Medium I
  role: other
  focus_group: null
  exposure_path: direct_import
  pinksheet: {"Rice, Thai 5%": 1.0}
  hs_codes: ["1006"]
  faostat_items: ["Rice"]
  unit: Rp/kg

bawang_putih:
  pihps_name: Bawang Putih
  variant: Bawang Putih Ukuran Sedang
  role: focus
  focus_group: bawang_putih
  exposure_path: direct_import
  pinksheet: {}
  hs_codes: ["070320"]
  faostat_items: []          # SUA Asia tidak memuat "Garlic" kering (hanya "Green garlic") -> U5, pakai BPS/Comtrade
  unit: Rp/kg

gula_pasir:
  pihps_name: Gula Pasir
