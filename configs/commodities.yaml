  hs_codes: ["1701"]
  faostat_items: ["Refined sugar", "Raw cane or beet sugar (centrifugal only)"]
  unit: Rp/kg

minyak_goreng:
  pihps_name: Minyak Goreng
  variant: Minyak Goreng Kemasan Bermerk 1   # D-023: Curah tidak lengkap (U18), jadi robustness Tier 2
