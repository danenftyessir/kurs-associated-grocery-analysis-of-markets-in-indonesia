# Registry sumber data mentah. `path` relatif terhadap Config.raw_dir (lokal: data/raw/).
# Dipakai oleh: snapshot (checksum), download (Tingkat C),
# loaders (path), dan docs/DATASETS.md. Path relatif terhadap root project.
# redistribute: boleh ikut zip juri? (false = hanya skrip unduh + checksum)
# availability: aturan as-of untuk Task 4 (lihat kagami.task4.features.as_of_join)

jisdor:
  path: bi_jisdor/jisdor_daily.xlsx
  publisher: Bank Indonesia
  role: "Penggerak 1: kurs IDR/USD harian (e_t)"
  coverage: "2013-05-20 .. 2026-11-18, hari kerja"
  license: "Tanpa lisensi eksplisit"
  redistribute: false
  retrieval: manual
  url: https://www.bi.go.id/id/statistik/informasi-kurs/jisdor/default.aspx
  availability: same_day

